<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Klasör Yükleyici</title>
<style>
body{font-family:Segoe UI,Arial;background:#0d1117;color:#e6edf3;margin:0;padding:24px}
.wrap{max-width:820px;margin:auto;background:#161b22;border:1px solid #30363d;border-radius:16px;padding:20px}
h1{margin-top:0}.muted{color:#8b949e}
input,button{font:inherit;padding:11px;border-radius:9px}
input{width:100%;box-sizing:border-box;background:#0d1117;color:#fff;border:1px solid #30363d}
button{border:0;background:#238636;color:#fff;font-weight:700;cursor:pointer}
button.alt{background:#1f6feb}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.box{border:1px dashed #4b5563;border-radius:12px;padding:24px;text-align:center;background:#0d1117}
.list{margin-top:14px;border:1px solid #30363d;border-radius:10px;overflow:hidden}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border-bottom:1px solid #30363d}
.item:last-child{border-bottom:0}.item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{margin-top:14px;background:#071019;border:1px solid #30363d;border-radius:10px;padding:12px;min-height:120px;max-height:240px;overflow:auto;white-space:pre-wrap;font:12px Consolas}
.ok{color:#4ade80}.err{color:#f87171}
</style>
</head>
<body>
<div class="wrap">
<h1>GitHub Klasör Yükleyici</h1>
<p class="muted">Hedef: <b>cemilsitesi / yeter</b> · branch: <b>main</b></p>

<label>GitHub token</label>
<input id="token" type="password" placeholder="github_pat_...">

<div class="box">
  <b>Klasör seç</b>
  <p class="muted">Kök klasör adı ve tüm alt klasör yapısı aynen korunur.</p>
  <div class="bar" style="justify-content:center">
    <button class="alt" id="folderBtn">Klasör Seç</button>
    <button id="uploadBtn">GitHub'a Yükle</button>
  </div>
  <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>
</div>

<p id="summary" class="muted">Henüz klasör seçilmedi.</p>
<div id="list" class="list" style="display:none"></div>
<div id="log" class="log">Hazır.</div>
</div>

<script>
const OWNER="cemilsitesi", REPO="yeter", BRANCH="main";
const $=id=>document.getElementById(id);
let selected=[];

$("token").value=sessionStorage.getItem("gh_token")||"";
$("folderBtn").onclick=()=>$("folderPicker").click();

$("folderPicker").onchange=e=>{
  selected=[...e.target.files].map(file=>({
    file,
    path:file.webkitRelativePath || file.name
  }));
  if(!selected.length)return;
  const root=selected[0].path.split("/")[0];
  $("summary").innerHTML="<b>"+esc(root)+"</b> seçildi — "+selected.length+" dosya";
  $("list").style.display="block";
  $("list").innerHTML=selected.map(x=>
    '<div class="item"><span>'+esc(x.path)+'</span><span>'+size(x.file.size)+'</span></div>'
  ).join("");
};

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function size(n){const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
function addLog(t,cls=""){const d=document.createElement("div");d.className=cls;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight}
function encPath(p){return p.split("/").filter(Boolean).map(encodeURIComponent).join("/")}

async function api(url,token,opt={}){
  return fetch(url,{...opt,headers:{
    "Accept":"application/vnd.github+json",
    "Authorization":"Bearer "+token,
    "X-GitHub-Api-Version":"2022-11-28",
    ...(opt.headers||{})
  }});
}

async function b64(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  let s="",step=32768;
  for(let i=0;i<bytes.length;i+=step)s+=String.fromCharCode(...bytes.subarray(i,i+step));
  return btoa(s);
}

async function sha(path,token){
  const r=await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encPath(path)}?ref=${BRANCH}`,token);
  if(r.status===404)return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||("Kontrol hatası "+r.status));
  return d.sha||null;
}

async function upload(item,token){
  const path=item.path.replace(/^\/+|\/+$/g,"");
  const oldSha=await sha(path,token);
  const body={message:path+" yüklendi",content:await b64(item.file),branch:BRANCH};
  if(oldSha)body.sha=oldSha;

  const r=await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encPath(path)}`,token,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||("Yükleme hatası "+r.status));
}

$("uploadBtn").onclick=async()=>{
  const token=$("token").value.trim();
  if(!token){addLog("Token girmen gerekiyor.","err");return}
  if(!selected.length){addLog("Önce klasör seç.","err");return}
  sessionStorage.setItem("gh_token",token);
  $("uploadBtn").disabled=true;
  let ok=0;
  try{
    for(let i=0;i<selected.length;i++){
      const item=selected[i];
      addLog((i+1)+"/"+selected.length+" "+item.path+" yükleniyor...");
      try{
        await upload(item,token);
        ok++;
        addLog("✓ "+item.path,"ok");
      }catch(e){
        addLog("✗ "+item.path+" — "+e.message,"err");
      }
    }
    addLog(ok+"/"+selected.length+" dosya tamamlandı.",ok===selected.length?"ok":"err");
  }finally{
    $("uploadBtn").disabled=false;
  }
};
</script>
</body>
</html>
