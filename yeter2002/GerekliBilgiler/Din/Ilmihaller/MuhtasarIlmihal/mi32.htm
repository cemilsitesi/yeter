<a name="072"><b>İstikbâl-i Kıble</B></a><br>
<br>
Namazın şartlarından dördüncüsü istikbâl-i kıbledir. İstikbâl-i kıble, Mekke'de Kâbe'yi görenler için tam Kâbe'ye doğru dönmektir. Uzakta olmaları sebebiyle Kâbeyi göremeyelerin ise Kâbe tarafına dönmeleri kâfîdir.<br>
