<a name="078"><b>İftitah Tekbiri</B></a><br>
<br>
Namazın rükünlerinden birincisi iftitah tekbiri yâni namaza &quot;Allâhü Ekber&quot; diyerek başlamaktır. Tekbir alırken ilk heceyi (Aaallâhü) şeklinde uzatmak câiz değildir. Bunu yapan, namaza girmemiş olur. Namaz içinde yaparsa namazı bozulur.<br>
