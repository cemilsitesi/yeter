<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub'a Dosya Yükle</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:#0d1117;color:#e6edf3
  }
  .card{
    width:min(620px,100%);background:#161b22;border:1px solid #30363d;
    border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)
  }
  h1{margin:0 0 6px;font-size:24px}
  .sub{margin:0 0 18px;color:#8b949e}
  label{display:block;margin:14px 0 6px;font-weight:700;font-size:13px}
  input,button{
    width:100%;padding:12px;border-radius:10px;font-size:14px
  }
  input{
    border:1px solid #30363d;background:#0d1117;color:#e6edf3
  }
  .drop{
    margin-top:14px;border:1.5px dashed #4b5563;border-radius:14px;
    padding:24px;text-align:center;background:#0d1117;cursor:pointer
  }
  .drop.drag{border-color:#58a6ff}
  .drop small{color:#8b949e}
  #files{margin-top:10px;display:grid;gap:8px}
  .file{
    padding:9px 10px;border:1px solid #30363d;border-radius:10px;
    background:#0d1117;display:flex;justify-content:space-between;gap:10px
  }
  .file span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file span:last-child{color:#8b949e;font-size:12px;white-space:nowrap}
  button{
    margin-top:14px;border:0;background:#238636;color:white;font-weight:800;cursor:pointer
  }
  button:hover{background:#2ea043}
  button:disabled{opacity:.6;cursor:not-allowed}
  .status{
    margin-top:14px;padding:11px;border-radius:10px;background:#0d1117;
    border:1px solid #30363d;white-space:pre-wrap;font-size:13px
  }
  .ok{border-color:#238636}.err{border-color:#da3633}
  .tiny{margin-top:10px;color:#8b949e;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div class="card">
  <h1>GitHub'a Dosya Yükle</h1>
  <p class="sub">Hedef hazır: <b>cemilsitesi / yeter</b></p>

  <label>GitHub token</label>
  <input id="token" type="password" autocomplete="off" placeholder="github_pat_...">

  <div class="drop" id="drop">
    <b>Dosyayı seç veya buraya bırak</b><br>
    <small>Birden fazla dosya seçebilirsin</small>
    <input id="picker" type="file" multiple hidden>
  </div>

  <div id="files"></div>

  <button id="upload">Yükle</button>

  <div id="status" class="status">Hazır.</div>
  <div class="tiny">
    Repo: <b>cemilsitesi/yeter</b> · Branch: <b>main</b> · Klasör: <b>ana dizin</b><br>
    Token yalnızca bu sekme açıkken tarayıcı oturumunda tutulur.
  </div>
</div>

<script>
const OWNER="cemilsitesi";
const REPO="yeter";
const BRANCH="main";
const FOLDER="";
const COMMIT_MESSAGE="Web sayfasından dosya yüklendi";

const $=id=>document.getElementById(id);
let selectedFiles=[];

$("token").value=sessionStorage.getItem("gh_token")||"";
$("token").addEventListener("input",()=>sessionStorage.setItem("gh_token",$("token").value));

function setStatus(msg,kind=""){
  $("status").textContent=msg;
  $("status").className="status"+(kind?` ${kind}`:"");
}
function humanSize(n){
  const u=["B","KB","MB","GB"]; let i=0,x=n;
  while(x>=1024&&i<u.length-1){x/=1024;i++}
  return `${x.toFixed(i?1:0)} ${u[i]}`;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderFiles(){
  $("files").innerHTML=selectedFiles.map(f=>
    `<div class="file"><span>${escapeHtml(f.name)}</span><span>${humanSize(f.size)}</span></div>`
  ).join("");
}
$("drop").onclick=()=>$("picker").click();
$("picker").onchange=e=>{selectedFiles=[...e.target.files];renderFiles()};

["dragenter","dragover"].forEach(ev=>$("drop").addEventListener(ev,e=>{
  e.preventDefault();$("drop").classList.add("drag");
}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{
  e.preventDefault();$("drop").classList.remove("drag");
}));
$("drop").addEventListener("drop",e=>{
  selectedFiles=[...e.dataTransfer.files];renderFiles();
});

function encodePath(path){
  return path.split("/").filter(Boolean).map(encodeURIComponent).join("/");
}
async function fileToBase64(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  let binary="",chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}
async function api(url,token,options={}){
  return fetch(url,{
    ...options,
    headers:{
      "Accept":"application/vnd.github+json",
      "Authorization":`Bearer ${token}`,
      "X-GitHub-Api-Version":"2022-11-28",
      ...(options.headers||{})
    }
  });
}
async function getSha(path,token){
  const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodePath(path)}?ref=${BRANCH}`;
  const r=await api(url,token);
  if(r.status===404)return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||`Kontrol hatası (${r.status})`);
  return d.sha||null;
}
async function uploadFile(file,token){
  const path=FOLDER?`${FOLDER}/${file.name}`:file.name;
  const sha=await getSha(path,token);
  const content=await fileToBase64(file);
  const body={message:COMMIT_MESSAGE,content,branch:BRANCH};
  if(sha)body.sha=sha;

  const r=await api(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodePath(path)}`,
    token,
    {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}
  );
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||`Yükleme hatası (${r.status})`);
  return {path,updated:!!sha};
}

$("upload").onclick=async()=>{
  const token=$("token").value.trim();
  if(!token){setStatus("Token girmen gerekiyor.","err");return}
  if(!selectedFiles.length){setStatus("Önce dosya seç.","err");return}

  $("upload").disabled=true;
  let ok=0;const lines=[];
  try{
    for(let i=0;i<selectedFiles.length;i++){
      const f=selectedFiles[i];
      setStatus(`Yükleniyor ${i+1}/${selectedFiles.length}: ${f.name}`);
      try{
        const r=await uploadFile(f,token);
        ok++;
        lines.push(`✅ ${r.path} — ${r.updated?"güncellendi":"yüklendi"}`);
      }catch(e){
        lines.push(`❌ ${f.name} — ${e.message}`);
      }
    }
    setStatus(`${ok}/${selectedFiles.length} tamamlandı.\n\n${lines.join("\n")}`,
      ok===selectedFiles.length?"ok":"err");
  }finally{
    $("upload").disabled=false;
  }
};
</script>
</body>
</html>
